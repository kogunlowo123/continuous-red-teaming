# Local development stack: platform + PostgreSQL + an OIDC provider + a
# reference agent (calibration target served over HTTP, A2A and MCP) + an
# OTel collector. Uses an in-memory signing key (CRT_DEV_EPHEMERAL_KEYS),
# plain-HTTP targets and a developer issuer that grants operator roles to
# any token it mints; never use this configuration outside a workstation.
name: continuous-red-teaming

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: redteam
      POSTGRES_USER: redteam
      POSTGRES_PASSWORD: redteam-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redteam -d redteam"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  reference-agent:
    build: .
    entrypoint: ["python", "-m", "continuous_red_teaming.adapters.reference_server"]
    environment:
      CRT_REFERENCE_HOST: 0.0.0.0
      CRT_REFERENCE_PORT: "8090"
      CRT_REFERENCE_ALLOWED_HOSTS: reference-agent:*,localhost:*
      CRT_REFERENCE_PROFILE: '{"marker_leak_rate": 0.02, "approval_bypass_rate": 0.05, "seed": 1}'
    ports:
      - "8090:8090"

  platform:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      oidc:
        condition: service_started
      reference-agent:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      CRT_ENVIRONMENT: development
      CRT_DEV_EPHEMERAL_KEYS: "true"
      CRT_PUBLIC_URL: http://localhost:8080
      CRT_DATABASE_URL: postgresql+asyncpg://redteam:redteam-local-only@postgres:5432/redteam
      CRT_AUDIT_LOG_PATH: /var/lib/continuous-red-teaming/audit/audit.jsonl
      CRT_TRUSTED_ISSUERS: >-
        [{"issuer": "http://oidc:8080/default", "jwks_url": "http://oidc:8080/default/jwks",
          "audience": "continuous-red-teaming", "kind": "user",
          "default_roles": ["redteam-operator", "release-pipeline", "redteam-auditor"]},
         {"issuer": "http://oidc:8080/approvers", "jwks_url": "http://oidc:8080/approvers/jwks",
          "audience": "continuous-red-teaming", "kind": "user",
          "default_roles": ["release-approver", "redteam-auditor"]}]
      CRT_TARGET_ALLOWED_HOSTS: '["reference-agent"]'
      CRT_ALLOW_INSECURE_TARGETS: "true"
      CRT_ALLOW_REFERENCE_TARGETS: "true"
      CRT_MCP_ALLOWED_HOSTS: '["localhost:*", "127.0.0.1:*"]'
      CRT_OTLP_ENDPOINT: http://otel-collector:4317
      CRT_LOG_LEVEL: DEBUG

volumes:
  pgdata:
