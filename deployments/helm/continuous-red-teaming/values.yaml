replicaCount: 2

image:
  repository: ghcr.io/kogunlowo123/continuous-red-teaming
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: continuous-red-teaming
  # Cloud workload identity bindings, e.g.
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  #   eks.amazonaws.com/role-arn (AWS IRSA)
  #   azure.workload.identity/client-id (Azure Workload ID)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
platform:
  environment: production
  publicUrl: ""  # REQUIRED: public HTTPS URL of the platform (advertised in the A2A agent card)
  # REQUIRED: OIDC issuers for people and CI pipelines, e.g. the enterprise IdP
  # and token.actions.githubusercontent.com with subject_patterns per repository.
  # Fields: issuer, jwks_url, audience, kind (user|pipeline), roles_claim,
  # default_roles, subject_patterns.
  trustedIssuers: []
  # REQUIRED: host globs that target and trace endpoints may use.
  targetAllowedHosts: []
  # REQUIRED: Host header values accepted on /mcp/ (DNS rebinding protection).
  mcpAllowedHosts: []
  allowReferenceTargets: false
  maxProbesPerRun: 5000
  probeConcurrency: 8
  maxActiveRuns: 4
  abortAfterConsecutiveErrors: 20
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint
  # kid -> base64 raw Ed25519 public key of retired report signing keys,
  # so reports signed before a rotation keep verifying.
  retiredReportKeys: {}
  # Optional agent identity fabric integration: inbound agent authorization
  # and the platform's own credential for targets with auth "fabric".
  fabric:
    url: ""
    issuer: ""  # required when url is set
    clientId: ""  # platform agent id; enables outbound credentials
    scope: ""
    tokenAudience: identity-fabric  # audience of the projected workload token
  # Optional LLM rubric judge (advisory until calibrated).
  llmJudge:
    enabled: false
    providersFile: /app/configs/providers.yaml
    envSecret: ""  # Secret with the ${...} variables configs/providers.yaml references

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: continuous-red-teaming-database
  # Secret holding the Ed25519 key that signs audit events and evaluation reports.
  auditKey: continuous-red-teaming-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the key within secrets.auditKey, e.g. audit-2026-10.pem
  # Optional Secret with target bearer tokens referenced by targets' auth_env.
  targetTokens: ""

audit:
  storageClassName: ""
  size: 20Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: continuous-red-teaming-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "2"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
  # Namespaces whose pods may call the platform (CI runners, agents, gateways).
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
