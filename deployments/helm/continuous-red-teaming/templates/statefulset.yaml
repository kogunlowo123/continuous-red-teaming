{{- /*
StatefulSet so each replica owns a persistent volume for its own signed
audit chain (/var/lib/continuous-red-teaming/audit/<pod>.jsonl). A log
shipper copies the files to the retention-locked bucket provisioned by
Terraform. Runs execute in the replica that accepted them.
*/ -}}
{{- $p := .Values.platform -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "crt.fullname" . }}
  labels: {{- include "crt.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "crt.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "crt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crt.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels: {{- include "crt.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: platform
          image: {{ include "crt.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "crt.fullname" . }}
            {{- if $p.llmJudge.enabled }}
            - secretRef:
                name: {{ required "platform.llmJudge.envSecret is required when the LLM judge is enabled" $p.llmJudge.envSecret }}
            {{- end }}
            {{- with .Values.secrets.targetTokens }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CRT_AUDIT_LOG_PATH
              value: /var/lib/continuous-red-teaming/audit/$(POD_NAME).jsonl
            - name: CRT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: DATABASE_URL
            - name: CRT_FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: audit-key
              mountPath: /etc/continuous-red-teaming/audit-key
              readOnly: true
            - name: audit
              mountPath: /var/lib/continuous-red-teaming/audit
            - name: tmp
              mountPath: /tmp
            {{- if $p.fabric.clientId }}
            - name: fabric-token
              mountPath: /var/run/secrets/continuous-red-teaming/fabric
              readOnly: true
            {{- end }}
      volumes:
        - name: audit-key
          secret:
            secretName: {{ .Values.secrets.auditKey }}
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if $p.fabric.clientId }}
        - name: fabric-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $p.fabric.tokenAudience }}
                  expirationSeconds: 600
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: audit
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.audit.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.audit.size }}
