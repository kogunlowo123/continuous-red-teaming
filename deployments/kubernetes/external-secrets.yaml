# Syncs platform secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (audit keys are created by
# operators, never by Terraform; see docs/runbooks/key-rotation.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: continuous-red-teaming-database
  namespace: agent-validation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: continuous-red-teaming-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: continuous-red-teaming-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: continuous-red-teaming-audit-key
  namespace: agent-validation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: continuous-red-teaming-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^continuous-red-teaming-audit-key-"
      rewrite:
        - regexp:
            source: "^continuous-red-teaming-audit-key-(.*)$"
            target: "audit-$1.pem"
